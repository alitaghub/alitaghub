            - paragraph [ref=f2e138]:
              - text: I lead the architecture and hands-on development of
              - strong [ref=f2e139]: Ace Prompt
              - text: at Configit, an AI assistant that helps engineers build product models. Before that I built and led a five-person AI team at Brüel & Kjær Vibro, worked in data science at Liva Healthcare, and founded DivERS Tech.
            - paragraph [ref=f2e140]: At Configit I build tool-using agents with planning, subagents and human approval at high-risk steps, on LangGraph and Azure. We use evaluations and trace review to catch regressions before release.
            - paragraph [ref=f2e141]:
              - strong [ref=f2e142]: "Stack:"
              - text: agentic AI · LLM applications · RAG · LLM evaluation and tracing · LLM fine-tuning (BERT, FLAN-T5) · LangGraph · LangChain · Python · TypeScript · Next.js · PyTorch · FastAPI · MLflow · Docker · Azure · AWS
            - generic [ref=f2e143]:
              - heading "Experience" [level=3] [ref=f2e144]
              - 'link "Permalink: Experience" [ref=f2e145] [cursor=pointer]':
                - /url: "#experience"
            - paragraph [ref=f2e148]:
              - strong [ref=f2e149]: Configit
              - text: · Principal AI Engineer and interim Product Owner · 2025 to now
            - list [ref=f2e150]:
              - listitem [ref=f2e151]: Lead architecture and development of Ace Prompt, bringing agentic AI to Configit's configuration platform.
              - listitem [ref=f2e152]: Build tool-using deep agents with LangChain, LangGraph, TypeScript, Next.js and Azure.
              - listitem [ref=f2e153]: Build agent evaluations, execution tracing and guardrails.
              - listitem [ref=f2e154]: As interim Product Owner, turn customer needs into priorities, scope and delivery plans.
            - paragraph [ref=f2e155]:
              - strong [ref=f2e156]: Brüel & Kjær Vibro
              - text: · Head of AI and Analytics, Senior Data Scientist · 2022 to 2025
            - list [ref=f2e157]:
              - listitem [ref=f2e158]: Built and mentored an AI team of five for the BKV Beyond condition monitoring platform.
              - listitem [ref=f2e159]: Owned the AI roadmap for predictive maintenance and anomaly detection.
              - listitem [ref=f2e160]: Took deep learning time-series models from design to production with PyTorch, MLflow, FastAPI and AWS SageMaker.
            - paragraph [ref=f2e161]:
              - strong [ref=f2e162]: Liva Healthcare
              - text: · Data science · 2020 to 2022
            - list [ref=f2e163]:
              - listitem [ref=f2e164]: Built ML and deep learning models on health records, behavioral data and wearables, in a regulated setting.
