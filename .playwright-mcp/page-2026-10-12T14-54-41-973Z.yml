              - heading "About me" [level=3] [ref=f3e166]
              - 'link "Permalink: About me" [ref=f3e167] [cursor=pointer]':
                - /url: "#about-me"
            - paragraph [ref=f3e170]:
              - text: I lead the architecture and hands-on development of
              - strong [ref=f3e171]: Ace Prompt
              - text: at Configit, an AI assistant that helps engineers build product models. Before that I built and led a five-person AI team at Brüel & Kjær Vibro, worked in data science at Liva Healthcare, and founded DivERS Tech.
            - paragraph [ref=f3e172]: At Configit I build tool-using agents with planning, subagents and human approval at high-risk steps, on LangGraph and Azure. We use evaluations and trace review to catch regressions before release.
            - paragraph [ref=f3e173]:
              - strong [ref=f3e174]: "Stack:"
              - text: agentic AI · LLM applications · RAG · LLM evaluation and tracing · LLM fine-tuning (BERT, FLAN-T5) · LangGraph · LangChain · Python · TypeScript · Next.js · PyTorch · FastAPI · MLflow · Docker · Azure · AWS
            - generic [ref=f3e175]:
              - heading "Experience" [level=3] [ref=f3e176]
              - 'link "Permalink: Experience" [ref=f3e177] [cursor=pointer]':
                - /url: "#experience"
            - paragraph [ref=f3e180]:
              - strong [ref=f3e181]: Configit
              - text: · Principal AI Engineer and interim Product Owner · 2025 to now
            - list [ref=f3e182]:
              - listitem [ref=f3e183]: Lead architecture and development of Ace Prompt, bringing agentic AI to Configit's configuration platform.
              - listitem [ref=f3e184]: Build tool-using deep agents with LangChain, LangGraph, TypeScript, Next.js and Azure.
              - listitem [ref=f3e185]: Build agent evaluations, execution tracing and guardrails.
              - listitem [ref=f3e186]: As interim Product Owner, turn customer needs into priorities, scope and delivery plans.
            - paragraph [ref=f3e187]:
              - strong [ref=f3e188]: Brüel & Kjær Vibro
              - text: · Head of AI and Analytics, Senior Data Scientist · 2022 to 2025
            - list [ref=f3e189]:
              - listitem [ref=f3e190]: Built and mentored an AI team of five for the BKV Beyond condition monitoring platform.
              - listitem [ref=f3e191]: Owned the AI roadmap for predictive maintenance and anomaly detection.
              - listitem [ref=f3e192]: Took deep learning time-series models from design to production with PyTorch, MLflow, FastAPI and AWS SageMaker.
            - paragraph [ref=f3e193]:
              - strong [ref=f3e194]: Liva Healthcare
              - text: · Data science · 2020 to 2022
            - list [ref=f3e195]:
              - listitem [ref=f3e196]: Built ML and deep learning models on health records, behavioral data and wearables, in a regulated setting.
