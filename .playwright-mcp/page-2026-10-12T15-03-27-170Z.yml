            - paragraph [ref=e180]:
              - strong [ref=e181]: Configit
              - text: · Principal AI Engineer and interim Product Owner · 2025 to now
            - list [ref=e182]:
              - listitem [ref=e183]: Lead architecture and development of Ace Prompt, bringing agentic AI to Configit's configuration platform.
              - listitem [ref=e184]: Build tool-using deep agents with LangChain, LangGraph, TypeScript, Next.js and Azure.
              - listitem [ref=e185]: Build agent evaluations, execution tracing and guardrails.
              - listitem [ref=e186]: As interim Product Owner, turn customer needs into priorities, scope and delivery plans.
            - paragraph [ref=e187]:
              - strong [ref=e188]: Brüel & Kjær Vibro
              - text: · Head of AI and Analytics, Senior Data Scientist · 2022 to 2025
            - list [ref=e189]:
              - listitem [ref=e190]: Built and mentored an AI team of five for the BKV Beyond condition monitoring platform.
              - listitem [ref=e191]: Owned the AI roadmap for predictive maintenance and anomaly detection.
              - listitem [ref=e192]: Took deep learning time-series models from design to production with PyTorch, MLflow, FastAPI and AWS SageMaker.
            - paragraph [ref=e193]:
              - strong [ref=e194]: Liva Healthcare
              - text: · Data science · 2020 to 2022
            - list [ref=e195]:
              - listitem [ref=e196]: Built ML and deep learning models on health records, behavioral data and wearables, in a regulated setting.
