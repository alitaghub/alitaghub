                  - /url: "#shipping-with-coding-agents"
              - paragraph [ref=f3e164]: I use Claude Code and Codex daily to go from written acceptance criteria to tested pull requests. I stay accountable for design, review, runtime QA and release.
              - img "Merged pull requests per quarter since Q3 2025, about six times more per month in 2026" [ref=f3e167]
              - 'img "Coding-agent workflow: spec, tickets, tests first, implement, review, runtime QA, human acceptance" [ref=f3e170]'
              - generic [ref=f3e171]:
                - heading "DivERS Tech" [level=3] [ref=f3e172]
                - 'link "Permalink: DivERS Tech" [ref=f3e173] [cursor=pointer]':
                  - /url: "#divers-tech"
              - paragraph [ref=f3e176]: Finding a job is painful, and hiring is full of bias. In 2020 I founded DivERS Tech to make recruitment fairer and more diverse with AI. The startup won Venture Cup's best digital startup award in Denmark and raised 630,000 DKK in public grants.
