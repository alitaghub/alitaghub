              - paragraph [ref=f3e129]:
                - text: I lead the architecture and hands-on development of
                - strong [ref=f3e130]: Ace Prompt
                - text: at Configit, an AI assistant that helps engineers build product models. Before that I built and led a five-person AI team at Brüel & Kjær Vibro, worked in data science at Liva Healthcare, and founded DivERS Tech.
              - paragraph [ref=f3e131]: At Configit I build tool-using agents with planning, subagents and human approval at high-risk steps, on LangGraph and Azure. We use evaluations and trace review to catch regressions before release.
              - paragraph [ref=f3e132]:
                - strong [ref=f3e133]: "Stack:"
                - text: agentic AI · LLM applications · RAG · LLM evaluation and tracing · LLM fine-tuning (BERT, FLAN-T5) · LangGraph · LangChain · Python · TypeScript · Next.js · PyTorch · FastAPI · MLflow · Docker · Azure · AWS
              - generic [ref=f3e134]:
                - heading "Experience" [level=3] [ref=f3e135]
                - 'link "Permalink: Experience" [ref=f3e136] [cursor=pointer]':
                  - /url: "#experience"
              - paragraph [ref=f3e139]:
                - strong [ref=f3e140]: Configit
                - text: · Principal AI Engineer and interim Product Owner · 2025 to now
              - list [ref=f3e141]:
                - listitem [ref=f3e142]: Lead architecture and development of Ace Prompt, bringing agentic AI to Configit's configuration platform.
                - listitem [ref=f3e143]: Build tool-using deep agents with LangChain, LangGraph, TypeScript, Next.js and Azure.
                - listitem [ref=f3e144]: Build agent evaluations, execution tracing and guardrails.
                - listitem [ref=f3e145]: As interim Product Owner, turn customer needs into priorities, scope and delivery plans.
              - paragraph [ref=f3e146]:
                - strong [ref=f3e147]: Brüel & Kjær Vibro
                - text: · Head of AI and Analytics, Senior Data Scientist · 2022 to 2025
              - list [ref=f3e148]:
                - listitem [ref=f3e149]: Built and mentored an AI team of five for the BKV Beyond condition monitoring platform.
                - listitem [ref=f3e150]: Owned the AI roadmap for predictive maintenance and anomaly detection.
                - listitem [ref=f3e151]: Took deep learning time-series models from design to production with PyTorch, MLflow, FastAPI and AWS SageMaker.
              - paragraph [ref=f3e152]:
                - strong [ref=f3e153]: Liva Healthcare
                - text: · Data science · 2020 to 2022
              - list [ref=f3e154]:
                - listitem [ref=f3e155]: Built ML and deep learning models on health records, behavioral data and wearables, in a regulated setting.
              - img "Work experience timeline since 2013" [ref=f3e158]
              - generic [ref=f3e159]:
                - heading "Shipping with coding agents" [level=3] [ref=f3e160]
