            - list [ref=e150]:
              - listitem [ref=e151]: Lead architecture and development of Ace Prompt, bringing agentic AI to Configit's configuration platform.
              - listitem [ref=e152]: Build tool-using deep agents with LangChain, LangGraph, TypeScript, Next.js and Azure.
              - listitem [ref=e153]: Build agent evaluations, execution tracing and guardrails.
              - listitem [ref=e154]: As interim Product Owner, turn customer needs into priorities, scope and delivery plans.
            - paragraph [ref=e155]:
              - strong [ref=e156]: Brüel & Kjær Vibro
              - text: · Head of AI and Analytics, Senior Data Scientist · 2022 to 2025
            - list [ref=e157]:
